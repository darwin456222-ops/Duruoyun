<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Pets: Subway Run 3D - Fixed Camera</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }
        body { background: #05070f; overflow: hidden; font-family: Arial, sans-serif; height: 100vh; }
        #ui {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); padding: 10px 25px; border-radius: 20px;
            border: 2px solid #a855f7; color: #fff; font-weight: bold; font-size: 18px; z-index: 10;
        }
        #gameover-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.95); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20; color: #ef4444;
        }
        #restart-btn {
            margin-top: 20px; padding: 12px 25px; background: #a855f7; color: #fff;
            border: none; border-radius: 10px; font-size: 16px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="ui">SKOR: <span id="score-text">0</span></div>

    <div id="gameover-screen">
        <h1>OYUN BİTTİ</h1>
        <button id="restart-btn" onclick="resetGame()">YENİDEN DENE</button>
    </div>

<script>
    let score = 0;
    let gameOver = false;
    let currentLane = 0; 
    const laneWidth = 2.5; // Şerit aralığını biraz daralttık ki ekrandan taşmasın
    let obstacles = [];
    let coins = [];
    let gameSpeed = 0.35;
    let spawnTimer = 0;

    // --- THREE.JS SAHNESİ ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070f);
    scene.fog = new THREE.FogExp2(0x05070f, 0.02);

    // Renderer Boyut Ayarı garanti altına alındı
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    // 🎥 Kamerayı tam arkaya çekip yukarı kaldırdık
    camera.position.set(0, 4.5, 0); 
    camera.lookAt(0, 0, -15);

    // Işıklandırma
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(0, 20, 10);
    scene.add(dirLight);

    // --- METRO YOLU ---
    const roadGeo = new THREE.BoxGeometry(8, 0.1, 1000);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.position.set(0, 0, -450);
    scene.add(road);

    // Mor Çizgiler
    for(let i = -1; i <= 1; i += 2) {
        const lineGeo = new THREE.BoxGeometry(0.1, 0.15, 1000);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xa855f7 });
        const line = new THREE.Mesh(lineGeo, lineMat);
        line.position.set(i * 4, 0.05, -450);
        scene.add(line);
    }

    // --- 🎭 KONTROL GRUBU (KARAKTER) ---
    let playerGroup = new THREE.Group();
    playerGroup.position.set(0, 0.5, -6); // Kameranın 6 birim önünde duracak
    scene.add(playerGroup);

    // Geçici Yeşil Parlak Küre
    const placeholderGeo = new THREE.SphereGeometry(0.6, 32, 32);
    const placeholderMat = new THREE.MeshStandardMaterial({ color: 0x00ff66, emissive: 0x00ff66, emissiveIntensity: 0.5 });
    let placeholder = new THREE.Mesh(placeholderGeo, placeholderMat);
    playerGroup.add(placeholder);

    // Model Yükleyici
    const loader = new THREE.GLTFLoader();
    loader.load('my_talking_tom_2_gus.glb', function(gltf) {
        playerGroup.remove(placeholder); 
        let model = gltf.scene;
        model.scale.set(1.0, 1.0, 1.0); 
        model.rotation.y = Math.PI; 
        playerGroup.add(model);
        console.log("Gus Modeli Yüklendi!");
    }, undefined, function(err) {
        console.log("Model yüklenemedi, yeşil küre görünmeye devam edecek.");
    });

    // --- DOKUNMATİK MOBİL SWIPE ---
    let touchStartX = 0;
    window.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; });
    window.addEventListener("touchmove", (e) => {
        if (gameOver) return;
        let touchEndX = e.touches[0].clientX;
        let diffX = touchEndX - touchStartX;

        if (Math.abs(diffX) > 25) {
            if (diffX > 0 && currentLane < 1) {
                currentLane++;
                touchStartX = touchEndX;
            } else if (diffX < 0 && currentLane > -1) {
                currentLane--;
                touchStartX = touchEndX;
            }
        }
    });

    // Klavye
    window.addEventListener("keydown", (e) => {
        if(e.key === "ArrowLeft" && currentLane > -1) currentLane--;
        if(e.key === "ArrowRight" && currentLane < 1) currentLane++;
    });

    // --- ELEMENT ÜRETİMİ ---
    function spawnElements() {
        let randomLane = Math.floor(Math.random() * 3) - 1; 
        
        if(Math.random() > 0.45) {
            // Engel
            const obsGeo = new THREE.BoxGeometry(1.4, 1.4, 1.4);
            const obsMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            const obs = new THREE.Mesh(obsGeo, obsMat);
            obs.position.set(randomLane * laneWidth, 0.7, -100);
            scene.add(obs);
            obstacles.push(obs);
        } else {
            // Altın
            const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 16);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xeab308, metalness: 0.7 });
            const coin = new THREE.Mesh(coinGeo, coinMat);
            coin.rotation.x = Math.PI / 2;
            coin.position.set(randomLane * laneWidth, 0.7, -100);
            scene.add(coin);
            coins.push(coin);
        }
    }

    // --- OYUN LOOPU ---
    function animate() {
        if (gameOver) return;

        requestAnimationFrame(animate);

        // Şerit yumuşatma
        let targetX = currentLane * laneWidth;
        playerGroup.position.x += (targetX - playerGroup.position.x) * 0.25;

        // Üretim döngüsü
        spawnTimer++;
        if(spawnTimer > 35) {
            spawnElements();
            spawnTimer = 0;
            gameSpeed += 0.002;
        }

        // Engelleri kaydır
        for(let i = obstacles.length - 1; i >= 0; i--) {
            let o = obstacles[i];
            o.position.z += gameSpeed;

            // Çarpışma tespiti (Mesafe tabanlı, kutu hatasını önlemek için)
            let dist = playerGroup.position.distanceTo(o.position);
            if(dist < 1.3) {
                gameOver = true;
                document.getElementById("gameover-screen").style.display = "flex";
            }

            if(o.position.z > 2) {
                scene.remove(o);
                obstacles.splice(i, 1);
            }
        }

        // Altınları kaydır ve topla
        for(let i = coins.length - 1; i >= 0; i--) {
            let c = coins[i];
            c.position.z += gameSpeed;
            c.rotation.z += 0.04;

            let dist = playerGroup.position.distanceTo(c.position);
            if(dist < 1.3) {
                score += 20;
                document.getElementById("score-text").innerText = score;
                scene.remove(c);
                coins.splice(i, 1);
                continue;
            }

            if(c.position.z > 2) {
                scene.remove(c);
                coins.splice(i, 1);
            }
        }

        renderer.render(scene, camera);
    }

    function resetGame() {
        obstacles.forEach(o => scene.remove(o));
        coins.forEach(c => scene.remove(c));
        obstacles = [];
        coins = [];
        score = 0;
        currentLane = 0;
        gameSpeed = 0.35;
        gameOver = false;
        document.getElementById("score-text").innerText = score;
        document.getElementById("gameover-screen").style.display = "none";
        playerGroup.position.x = 0;
        animate();
    }

    // Döngüyü ilk kez tetikle
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
