<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Talking Gus 3D - Fixed Link</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 20px;
        }
        #ui-top {
            background: rgba(15, 23, 42, 0.7);
            padding: 10px 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-bottom {
            display: flex;
            gap: 20px;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .action-btn {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50%;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
            transition: transform 0.1s;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn:active {
            transform: scale(0.9);
        }
        #loading-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #94a3b8;
            z-index: 5;
            background: rgba(15, 23, 42, 0.85);
            padding: 15px 30px;
            border-radius: 14px;
            border: 1px solid #334155;
            pointer-events: none;
            text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="ui-top">🐾 MY TALKING GUS 🐾</div>
    
    <div id="loading-text">Gus Buluttan Geliyor...</div>
    <div id="canvas-container"></div>

    <div id="ui-bottom">
        <button class="action-btn" onclick="interact('feed')">🍖</button>
        <button class="action-btn" onclick="interact('poke')">👉</button>
        <button class="action-btn" onclick="interact('dance')">🕺</button>
    </div>

<script>
    let scene, camera, renderer, gusModel, mixer;
    let clock = new THREE.Clock();

    // Senin verdiğin linkin doğrudan tarayıcı tarafından okunabilen adresi:
    const modelUrl = "https://raw.githubusercontent.com/darwin456222-ops/Duruoyun/main/my_talking_tom_2_gus.glb";

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0, 0.5, 2.5); 

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        // Işıklandırma Güçlendirildi
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.2);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight1.position.set(5, 10, 7);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight2.position.set(-5, 5, -5);
        scene.add(dirLight2);

        const loader = new THREE.GLTFLoader();
        
        loader.load(modelUrl, 
            function (gltf) {
                gusModel = gltf.scene;
                
                // Otomatik boyutlandırma ve merkezleme
                const box = new THREE.Box3().setFromObject(gusModel);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                
                gusModel.position.x += (gusModel.position.x - center.x);
                gusModel.position.y += (gusModel.position.y - center.y) - 0.2;
                gusModel.position.z += (gusModel.position.z - center.z);
                
                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 0) {
                    const scale = 1.4 / maxDim;
                    gusModel.scale.set(scale, scale, scale);
                }

                scene.add(gusModel);
                document.getElementById('loading-text').style.display = 'none';

                // Dosya içindeki orijinal iskelet animasyonlarını oynatır
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(gusModel);
                    mixer.clipAction(gltf.animations[0]).play();
                }
            }, 
            function (xhr) {
                if(xhr.total > 0) {
                    document.getElementById('loading-text').innerText = "Gus Yükleniyor: %" + Math.round((xhr.loaded / xhr.total * 100));
                }
            }, 
            function (error) {
                console.error(error);
                document.getElementById('loading-text').innerHTML = "Yükleme Hatası!<br><span style='font-size:12px; color:#ef4444;'>Lütfen internetinizi ve linki kontrol edin.</span>";
            }
        );

        window.addEventListener('resize', onWindowResize, false);
        animate();
    }

    // Etkileşim Buton Komutları
    function interact(action) {
        if (!gusModel) return;

        if (action === 'feed') {
            gusModel.position.y += 0.2;
            setTimeout(() => gusModel.position.y -= 0.2, 200);
        } 
        else if (action === 'poke') {
            gusModel.rotation.z = 0.2;
            setTimeout(() => gusModel.rotation.z = -0.2, 150);
            setTimeout(() => gusModel.rotation.z = 0, 300);
        }
        else if (action === 'dance') {
            let targetRotation = gusModel.rotation.y + Math.PI * 2;
            let danceInterval = setInterval(() => {
                gusModel.rotation.y += 0.25;
                if (gusModel.rotation.y >= targetRotation) {
                    clearInterval(danceInterval);
                }
            }, 20);
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        let delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        // Özel bir animasyon yoksa Gus hafifçe sağa sola salınarak nefes alma efekti yapar
        if (gusModel && !mixer) {
            gusModel.rotation.y = Math.sin(Date.now() * 0.0015) * 0.15;
        }

        renderer.render(scene, camera);
    }

    window.onload = init3D;
</script>
</body>
</html>
