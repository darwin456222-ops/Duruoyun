<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gus ile Bulmaca Macerası</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* 3DS Çift Ekran Kasası Tasarımı */
        #game-container {
            width: 400px;
            height: 700px;
            background: #333;
            border: 12px solid #222;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        /* Üst Ekran: 3D Gus Modeli */
        #top-screen {
            flex: 1;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            border-bottom: 8px solid #222;
            position: relative;
        }
        /* Alt Ekran: Fizik tabanlı oyun alanı */
        #bottom-screen {
            flex: 1;
            background-color: #fff7e6;
            position: relative;
        }
        .screen-label {
            position: absolute;
            top: 5px;
            left: 10px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
        #bottom-screen .screen-label {
            color: rgba(0,0,0,0.4);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

    <div id="game-container">
        <div id="top-screen">
            <span class="screen-label">GUS CAM</span>
        </div>
        
        <div id="bottom-screen">
            <span class="screen-label">DOKUNMATİK EKRAN</span>
        </div>
    </div>

    <script>
        // --- 1. ÜST EKRAN: THREE.JS İLE 3D GUS AYARLARI ---
        const topScreen = document.getElementById('top-screen');
        const scene = new THREE.Scene();
        
        // Kamera ve Renderer
        const camera = new THREE.PerspectiveCamera(45, topScreen.clientWidth / topScreen.clientHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 3); // Kamerayı Gus'ın yüz hizasına göre ayarlarız
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(topScreen.clientWidth, topScreen.clientHeight);
        topScreen.appendChild(renderer.domElement);

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // Gus Modelini Yükleme
        let mixer; // Animasyonları kontrol etmek için
        let gusModel;
        const loader = new THREE.GLTFLoader();
        
        // Dosya ismi senin yüklediğin gibi "my_talking_tom_2_gus.glb"
        loader.load('my_talking_tom_2_gus.glb', function(gltf) {
            gusModel = gltf.scene;
            gusModel.scale.set(1, 1, 1); // Gerekirse model boyutunu buradan büyütüp küçültebiliriz
            gusModel.position.set(0, 0, 0);
            scene.add(gusModel);

            // Eğer modelin içinde hazır animasyonlar varsa oynatmak için:
            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(gusModel);
                // İlk animasyonu (muhtemelen Idle/Bekleme) varsayılan olarak oynatıyoruz
                const action = mixer.clipAction(gltf.animations[0]);
                action.play();
            }
        }, undefined, function(error) {
            console.error('Model yüklenirken hata oluştu:', error);
        });

        // Üst Ekran Animasyon Döngüsü
        const clock = new THREE.Clock();
        function animateTopScreen() {
            requestAnimationFrame(animateTopScreen);
            
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            // Model yüklenirse kendi ekseninde hafifçe nefes alıyor gibi sallanma efekti (Test için)
            if (gusModel && !mixer) {
                gusModel.rotation.y = Math.sin(Date.now() * 0.001) * 0.1;
            }

            renderer.render(scene, camera);
        }
        animateTopScreen();


        // --- 2. ALT EKRAN: MATTER.JS İLE FİZİK VE OYUN ALANI ---
        const { Engine, Render, Runner, Bodies, Composite, Constraint, Mouse, MouseConstraint } = Matter;

        const engine = Engine.create();
        const bottomScreen = document.getElementById('bottom-screen');

        const render = Render.create({
            element: bottomScreen,
            engine: engine,
            options: {
                width: bottomScreen.clientWidth,
                height: bottomScreen.clientHeight,
                wireframes: false, // Renkli ve dolgulu görünmesi için false yapıyoruz
                background: '#fff7e6'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // Sınırlar (Duvarlar ve Zemin)
        const ground = Bodies.rectangle(200, bottomScreen.clientHeight + 10, 400, 20, { isStatic: true });
        Composite.add(engine.world, ground);

        // Örnek Bir Şeker (Fizik Objesi)
        const candy = Bodies.circle(200, 100, 20, {
            render: { fillStyle: '#ff4d4d' },
            restitution: 0.5 // Esneklik
        });

        // Şekeri havada tutacak bir ip (Constraint)
        const ropeAnchor = { x: 200, y: 20 };
        const rope = Constraint.create({
            pointA: ropeAnchor,
            bodyB: candy,
            stiffness: 0.9,
            render: { strokeStyle: '#8b5a2b', lineWidth: 4 }
        });

        Composite.add(engine.world, [candy, rope]);

        // --- 3. ETKİLEŞİM VE TEPKİ MEKANİZMASI ---
        // Fare veya dokunmatik ekran hareketlerini algılama (İp kesme simülasyonu için)
        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: {
                stiffness: 0.2,
                render: { visible: false }
            }
        });
        Composite.add(engine.world, mouseConstraint);

        // Şekerin durumunu izleyip üst ekrandaki Gus'a haber uçuran mekanizma
        Matter.Events.on(engine, 'afterUpdate', function() {
            // Eğer şeker ekranın altına çok yaklaşırsa (Gus'a ulaştı veya düştü varsayımı)
            if (candy.position.y > bottomScreen.clientHeight - 50) {
                // Burada üst ekrandaki Gus'ın animasyonunu değiştireceğiz!
                triggerGusReaction('SUCCESS');
            }
        });

        // Gus'ın tepkilerini tetikleyen fonksiyon
        function triggerGusReaction(state) {
            if (!mixer || !gusModel) return;
            
            // Model içindeki farklı animasyonları durum koduna göre çağırabiliriz
            // Örneğin: state === 'SUCCESS' ise gltf.animations[1]'i (Sevinme) oynat
            console.log("Gus şu an şu tepkiyi veriyor:", state);
        }

    </style>
</body>
        </html>
