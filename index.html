<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Pets: Subway Run 3D - Real Models</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }
        body { background: #050b14; overflow: hidden; font-family: Arial, sans-serif; height: 100vh; }
        #ui {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7); padding: 10px 20px; border-radius: 20px;
            border: 2px solid #a855f7; color: #a855f7; font-weight: bold; font-size: 18px; z-index: 10;
        }
        #gameover-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.95); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20; color: #ef4444;
        }
        #restart-btn {
            margin-top: 20px; padding: 12px 25px; background: #a855f7; color: #fff;
            border: none; border-radius: 10px; font-size: 16px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="ui">SKOR: <span id="score-text">0</span></div>

    <div id="gameover-screen">
        <h1>EYVAH, ÇARPTIN!</h1>
        <p style="color: #fff; margin-top: 10px;">Gus metrodan elendi.</p>
        <button id="restart-btn" onclick="resetGame()">YENİDEN DENE</button>
    </div>

<script>
    let score = 0;
    let gameOver = false;
    let currentLane = 0; // -1: Sol, 0: Orta, 1: Sağ
    const laneWidth = 3;
    let obstacles = [];
    let gameSpeed = 0.35;
    let spawnTimer = 0;

    // --- THREE.JS KURULUMU ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060914);
    scene.fog = new THREE.FogExp2(0x060914, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Işıklar (Karakterlerin detaylı görünmesi için artırıldı)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(0, 15, 10);
    scene.add(dirLight);

    // --- METRO YOLU ---
    const roadGeo = new THREE.BoxGeometry(10, 0.1, 1000);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.position.z = -450;
    scene.add(road);

    // Yan Neon Şerit Sınırları
    for(let i = -1; i <= 1; i += 2) {
        const lineGeo = new THREE.BoxGeometry(0.15, 0.15, 1000);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xa855f7 });
        const line = new THREE.Mesh(lineGeo, lineMat);
        line.position.set(i * (laneWidth * 1.5), 0, -450);
        scene.add(line);
    }

    // --- 🎭 3D MODEL YÜKLEYİCİ GRUBU ---
    let playerGroup = new THREE.Group(); // Modeli rahat döndürmek/taşımak için grup oluşturuyoruz
    playerGroup.position.set(0, 0, -5);
    scene.add(playerGroup);

    // Başlangıçta model yüklenirken boş kalmasın diye geçici bir neon küre koyuyoruz
    const placeholderGeo = new THREE.SphereGeometry(0.8, 16, 16);
    const placeholderMat = new THREE.MeshBasicMaterial({ color: 0xa855f7, wireframe: true });
    let placeholder = new THREE.Mesh(placeholderGeo, placeholderMat);
    playerGroup.add(placeholder);

    // GLTF Yükleyici ile senin "my_talking_tom_2_gus.glb" modelini çağırıyoruz!
    const loader = new THREE.GLTFLoader();
    
    // NOT: Kodun çalışması için bu HTML dosyası ile "my_talking_tom_2_gus.glb" aynı klasörde olmalı.
    loader.load('my_talking_tom_2_gus.glb', function(gltf) {
        playerGroup.remove(placeholder); // Model gelince geçici küreyi siliyoruz
        
        let model = gltf.scene;
        
        // Modelin boyutu çok büyük veya küçük gelirse buradaki sayıları değiştirebilirsin (Örn: 1.2, 1.2, 1.2)
        model.scale.set(1.0, 1.0, 1.0); 
        
        // Modelin yönü kameraya ters dönerse düzeltmek için Y ekseninde döndürüyoruz
        model.rotation.y = Math.PI; 
        
        playerGroup.add(model);
        console.log("Gus 3D Modeli Başarıyla Yüklendi!");
    }, undefined, function(err) {
        console.log("Model dosyası bulunamadı, geçici küreyle devam ediliyor. Hata:", err);
    });

    camera.position.set(0, 3.5, 1);
    camera.lookAt(0, 1, -8);

    // --- MOBİL DOKUNMATİK SWIPE KONTROLÜ ---
    let touchStartX = 0;
    window.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; });
    window.addEventListener("touchmove", (e) => {
        if (gameOver) return;
        let touchEndX = e.touches[0].clientX;
        let diffX = touchEndX - touchStartX;

        if (Math.abs(diffX) > 35) {
            if (diffX > 0 && currentLane < 1) {
                currentLane++;
                touchStartX = touchEndX;
            } else if (diffX < 0 && currentLane > -1) {
                currentLane--;
                touchStartX = touchEndX;
            }
        }
    });

    // Klavye Desteği
    window.addEventListener("keydown", (e) => {
        if(e.key === "ArrowLeft" && currentLane > -1) currentLane--;
        if(e.key === "ArrowRight" && currentLane < 1) currentLane++;
    });

    // --- ENGELLER (OBSTACLES) ---
    function spawnObstacle() {
        let randomLane = Math.floor(Math.random() * 3) - 1;
        
        const obsGeo = new THREE.BoxGeometry(1.8, 1.8, 1.8);
        const obsMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 });
        const obs = new THREE.Mesh(obsGeo, obsMat);
        
        obs.position.set(randomLane * laneWidth, 0.9, -120);
        scene.add(obs);
        obstacles.push(obs);
    }

    // --- ANA OYUN DÖNGÜSÜ ---
    function animate() {
        if (gameOver) return;

        requestAnimationFrame(animate);

        // Şerit değiştirme yumuşatması
        let targetX = currentLane * laneWidth;
        playerGroup.position.x += (targetX - playerGroup.position.x) * 0.22;

        // Karakter koşarken hafifçe sağa sola sallansın (Koşma efekti)
        if (playerGroup.children.length > 0) {
            playerGroup.rotation.z = Math.sin(Date.now() * 0.01) * 0.05;
        }

        // Engel üretimi ve hızlanma
        spawnTimer++;
        if(spawnTimer > 35) {
            spawnObstacle();
            spawnTimer = 0;
            score += 10;
            document.getElementById("score-text").innerText = score;
            gameSpeed += 0.004;
        }

        // Engellerin hareketi ve çarpışma tespiti
        for(let i = obstacles.length - 1; i >= 0; i--) {
            let o = obstacles[i];
            o.position.z += gameSpeed;

            // Çarpışma kutuları hesabı
            let playerBox = new THREE.Box3().setFromObject(playerGroup);
            let obstacleBox = new THREE.Box3().setFromObject(o);

            if(playerBox.intersectsBox(obstacleBox)) {
                gameOver = true;
                document.getElementById("gameover-screen").style.display = "flex";
            }

            if(o.position.z > 5) {
                scene.remove(o);
                obstacles.splice(i, 1);
            }
        }

        renderer.render(scene, camera);
    }

    function resetGame() {
        obstacles.forEach(o => scene.remove(o));
        obstacles = [];
        score = 0;
        currentLane = 0;
        gameSpeed = 0.35;
        gameOver = false;
        document.getElementById("score-text").innerText = score;
        document.getElementById("gameover-screen").style.display = "none";
        animate();
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
