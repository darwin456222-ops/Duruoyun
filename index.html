<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Pets - All In One Screen</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 20px;
        }
        
        #ui-top {
            background: rgba(15, 23, 42, 0.75);
            padding: 12px 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 1px;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-top: 10px;
            text-align: center;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-bottom {
            background: rgba(15, 23, 42, 0.6);
            padding: 15px 25px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 25px;
            z-index: 10;
            width: auto;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .action-btn {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(124, 58, 237, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            width: 68px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn:active {
            transform: scale(0.9);
            box-shadow: 0 2px 5px rgba(124, 58, 237, 0.2);
        }
        #loading-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #94a3b8;
            z-index: 105;
            background: rgba(15, 23, 42, 0.9);
            padding: 15px 30px;
            border-radius: 14px;
            border: 1px solid #334155;
            pointer-events: none;
            text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="ui-top">🐾 THE PETS PARTY 3D 🐾</div>
    
    <div id="loading-text">Evcil Hayvanlar Eve Toplanıyor...</div>
    <div id="canvas-container"></div>

    <div id="ui-bottom">
        <button class="action-btn" onclick="interactAll('feed')">🍖</button>
        <button class="action-btn" onclick="interactAll('poke')">👉</button>
        <button class="action-btn" onclick="interactAll('dance')">🕺</button>
    </div>

<script>
    let scene, camera, renderer;
    let models = { gus: null, flip: null, sugar: null };
    let mixers = [];
    let clock = new THREE.Clock();

    const urls = {
        gus: "https://raw.githubusercontent.com/darwin456222-ops/Duruoyun/main/my_talking_tom_2_gus.glb",
        flip: "https://raw.githubusercontent.com/darwin456222-ops/Duruoyun/main/my_talking_tom_2_flip%20(1).glb",
        sugar: "https://raw.githubusercontent.com/darwin456222-ops/Duruoyun/main/my_talking_tom_2_sugar.glb"
    };

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();

        // Üçünü birden genişçe görmek için kamerayı çok hafif geriye ve yukarıya aldık
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0, 0.35, 1.6); 
        camera.lookAt(0, 0.15, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        // 💡 Odayı aydınlatan ve karakterleri canlandıran güçlü stüdyo ışıkları
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.4);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight1.position.set(4, 10, 6);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xa855f7, 0.6); // Karakterlere tatlı mor bir sahne havası verir
        dirLight2.position.set(-4, 5, -2);
        scene.add(dirLight2);

        // 🏠 KODLA ODA ZEMİNİ OLUŞTURMA (Beyaz hatayı bitiren harika 3D taban)
        const floorGeo = new THREE.PlaneGeometry(10, 10);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x1e1b4b, 
            roughness: 0.6,
            metalness: 0.1
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.25;
        scene.add(floor);

        // Sırayla modellerimizi yükleyelim
        loadAllModels();

        window.addEventListener('resize', onWindowResize, false);
        animate();
    }

    let loadedCount = 0;
    function loadAllModels() {
        const loader = new THREE.GLTFLoader();

        // 1. GUS'I YÜKLE (Tam Ortada)
        loader.load(urls.gus, function(gltf) {
            models.gus = gltf.scene;
            models.gus.position.set(0, -0.22, 0); // Merkez
            models.gus.scale.set(0.9, 0.9, 0.9);
            scene.add(models.gus);
            if(gltf.animations.length > 0) {
                let mixer = new THREE.AnimationMixer(models.gus);
                mixer.clipAction(gltf.animations[0]).play();
                mixers.push(mixer);
            }
            checkLoadingStatus();
        });

        // 2. FLIP'İ YÜKLE (Solda)
        loader.load(urls.flip, function(gltf) {
            models.flip = gltf.scene;
            models.flip.position.set(-0.38, -0.22, -0.05); // Sol taraf
            models.flip.scale.set(0.9, 0.9, 0.9);
            models.flip.rotation.y = 0.2; // Hafif merkeze baksın
            scene.add(models.flip);
            if(gltf.animations.length > 0) {
                let mixer = new THREE.AnimationMixer(models.flip);
                mixer.clipAction(gltf.animations[0]).play();
                mixers.push(mixer);
            }
            checkLoadingStatus();
        });

        // 3. SUGAR'I YÜKLE (Sağda)
        loader.load(urls.sugar, function(gltf) {
            models.sugar = gltf.scene;
            models.sugar.position.set(0.38, -0.22, -0.05); // Sağ taraf
            models.sugar.scale.set(0.9, 0.9, 0.9);
            models.sugar.rotation.y = -0.2; // Hafif merkeze baksın
            scene.add(models.sugar);
            if(gltf.animations.length > 0) {
                let mixer = new THREE.AnimationMixer(models.sugar);
                mixer.clipAction(gltf.animations[0]).play();
                mixers.push(mixer);
            }
            checkLoadingStatus();
        });
    }

    function checkLoadingStatus() {
        loadedCount++;
        if(loadedCount === 3) {
            document.getElementById('loading-text').style.display = 'none';
        } else {
            document.getElementById('loading-text').innerText = `Karakterler Toplanıyor (${loadedCount}/3)...`;
        }
    }

    // Üç karaktere birden aynı anda animasyon yaptırma fonksiyonu!
    function interactAll(action) {
        Object.values(models).forEach(model => {
            if (!model) return;

            if (action === 'feed') {
                model.position.y += 0.08;
                setTimeout(() => model.position.y -= 0.08, 200);
            } 
            else if (action === 'poke') {
                model.rotation.z = 0.05;
                setTimeout(() => model.rotation.z = -0.05, 150);
                setTimeout(() => model.rotation.z = 0, 300);
            }
            else if (action === 'dance') {
                let startRotation = model.rotation.y;
                let targetRotation = startRotation + Math.PI * 2;
                let danceInterval = setInterval(() => {
                    model.rotation.y += 0.25;
                    if (model.rotation.y >= targetRotation) {
                        clearInterval(danceInterval);
                        model.rotation.y = startRotation; // Eski açısına sabitle
                    }
                }, 20);
            }
        });
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        let delta = clock.getDelta();
        
        // Aktif olan tüm animasyon mikserlerini güncelle
        mixers.forEach(mixer => mixer.update(delta));

        // Eğer animasyon dosyası yoksa kendi kendilerine tatlı tatlı sallansınlar
        if (mixers.length === 0) {
            let time = Date.now() * 0.0015;
            if(models.gus) models.gus.rotation.y = Math.sin(time) * 0.04;
            if(models.flip) models.flip.rotation.y = 0.2 + Math.sin(time + 1) * 0.04;
            if(models.sugar) models.sugar.rotation.y = -0.2 + Math.sin(time + 2) * 0.04;
        }

        renderer.render(scene, camera);
    }

    // Sayfa açıldığında otomatik başlat
    window.onload = init3D;
</script>
</body>
</html>
