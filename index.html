<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Talking Pets 3D - Camera Focus</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 20px;
        }
        
        #selection-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        #selection-screen h1 {
            font-size: 28px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
        }
        .char-select-btn {
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            width: 210px;
            transition: transform 0.1s;
        }
        .char-select-btn.gus {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            box-shadow: 0 5px 15px rgba(124, 58, 237, 0.4);
        }
        .char-select-btn.squeak {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            box-shadow: 0 5px 15px rgba(202, 138, 4, 0.4);
        }
        .char-select-btn:active {
            transform: scale(0.95);
        }

        #ui-top {
            background: rgba(15, 23, 42, 0.7);
            padding: 10px 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: none;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-bottom {
            display: none;
            gap: 20px;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .action-btn {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50%;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
            transition: transform 0.1s;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn:active {
            transform: scale(0.9);
        }
        #back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: bold;
            z-index: 20;
            display: none;
        }
        #loading-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #94a3b8;
            z-index: 5;
            background: rgba(15, 23, 42, 0.85);
            padding: 15px 30px;
            border-radius: 14px;
            border: 1px solid #334155;
            pointer-events: none;
            text-align: center;
            display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="selection-screen">
        <h1>EVCİL HAYVAN SEÇ</h1>
        <button class="char-select-btn gus" onclick="selectCharacter('gus')">Gus 🐾</button>
        <button class="char-select-btn squeak" onclick="selectCharacter('squeak')">Squeak 🐹</button>
    </div>

    <button id="back-btn" onclick="goBack()">⬅ Geri</button>
    <div id="ui-top">🐾 MY TALKING PET 🐾</div>
    
    <div id="loading-text">Model Yükleniyor...</div>
    <div id="canvas-container"></div>

    <div id="ui-bottom">
        <button class="action-btn" onclick="interact('feed')">🍖</button>
        <button class="action-btn" onclick="interact('poke')">👉</button>
        <button class="action-btn" onclick="interact('dance')">🕺</button>
    </div>

<script>
    let scene, camera, renderer, mainModel, mixer;
    let clock = new THREE.Clock();
    let currentPet = 'gus';

    const modelUrl = "https://raw.githubusercontent.com/darwin456222-ops/Duruoyun/main/tom_2_pets%20(1).glb";

    function selectCharacter(pet) {
        currentPet = pet;
        document.getElementById('selection-screen').style.display = 'none';
        document.getElementById('ui-top').style.display = 'block';
        document.getElementById('ui-bottom').style.display = 'flex';
        document.getElementById('back-btn').style.display = 'block';
        document.getElementById('ui-top').innerText = pet === 'gus' ? "🐾 MY TALKING GUS 🐾" : "🐹 MY TALKING SQUEAK 🐹";
        
        const actionButtons = document.querySelectorAll('.action-btn');
        if (pet === 'squeak') {
            actionButtons.forEach(btn => btn.style.background = 'linear-gradient(135deg, #eab308 0%, #ca8a04 100%)');
        } else {
            actionButtons.forEach(btn => btn.style.background = 'linear-gradient(135deg, #a855f7 0%, #7c3aed 100%)');
        }

        if (!scene) {
            init3D();
        } else {
            focusCameraOnCharacter();
        }
    }

    function goBack() {
        document.getElementById('selection-screen').style.display = 'flex';
        document.getElementById('ui-top').style.display = 'none';
        document.getElementById('ui-bottom').style.display = 'none';
        document.getElementById('back-btn').style.display = 'none';
    }

    function init3D() {
        document.getElementById('loading-text').style.display = 'block';
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight1.position.set(5, 10, 7);
        scene.add(dirLight1);

        const loader = new THREE.GLTFLoader();
        
        loader.load(modelUrl, 
            function (gltf) {
                mainModel = gltf.scene;
                
                // Modeli tam ortalayalım
                mainModel.position.set(0, -0.4, 0);
                mainModel.scale.set(1.1, 1.1, 1.1);
                
                scene.add(mainModel);
                document.getElementById('loading-text').style.display = 'none';

                // Kamerayı seçilen karaktere göre konumlandır
                focusCameraOnCharacter();

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(mainModel);
                    mixer.clipAction(gltf.animations[0]).play();
                }
            }, 
            function (xhr) {
                if(xhr.total > 0) {
                    document.getElementById('loading-text').innerText = "Yükleniyor: %" + Math.round((xhr.loaded / xhr.total * 100));
                }
            }, 
            function (error) {
                console.error(error);
            }
        );

        window.addEventListener('resize', onWindowResize, false);
        animate();
    }

    // 🎯 YENİ STRATEJİ: KAMERAYI KARAKTERE ODAKLAMA FONKSİYONU
    function focusCameraOnCharacter() {
        if (!mainModel) return;

        if (currentPet === 'squeak') {
            // Squeak en solda olduğu için kamerayı sola (-0.65) kaydırıp yaklaştırıyoruz
            camera.position.set(-0.62, 0.0, 0.8); 
            camera.lookAt(-0.62, 0.0, 0);
        } else {
            // Gus tam ortada olduğu için kamerayı merkeze (0) hizalıyoruz
            camera.position.set(0.02, -0.02, 0.8); 
            camera.lookAt(0.02, -0.02, 0);
        }
    }

    function interact(action) {
        if (!mainModel) return;

        if (action === 'feed') {
            mainModel.position.y += 0.1;
            setTimeout(() => mainModel.position.y -= 0.1, 200);
        } 
        else if (action === 'poke') {
            mainModel.rotation.z = 0.08;
            setTimeout(() => mainModel.rotation.z = -0.08, 150);
            setTimeout(() => mainModel.rotation.z = 0, 300);
        }
        else if (action === 'dance') {
            let targetRotation = mainModel.rotation.y + Math.PI * 2;
            let danceInterval = setInterval(() => {
                mainModel.rotation.y += 0.25;
                if (mainModel.rotation.y >= targetRotation) {
                    clearInterval(danceInterval);
                }
            }, 20);
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        let delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        // Karakterlerin kendi etrafında hafif sallanma animasyonu
        if (mainModel && !mixer) {
            mainModel.rotation.y = Math.sin(Date.now() * 0.0015) * 0.05;
        }

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
