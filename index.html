<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Talking Pets 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 20px;
        }
        
        /* Karakter Seçim Ekranı */
        #selection-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        #selection-screen h1 {
            font-size: 28px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
        }
        .char-select-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(29, 78, 216, 0.4);
            width: 200px;
            transition: transform 0.1s;
        }
        .char-select-btn.gus {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            box-shadow: 0 5px 15px rgba(124, 58, 237, 0.4);
        }
        .char-select-btn:active {
            transform: scale(0.95);
        }

        #ui-top {
            background: rgba(15, 23, 42, 0.7);
            padding: 10px 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: none;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-bottom {
            display: none;
            gap: 20px;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .action-btn {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50%;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
            transition: transform 0.1s;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn:active {
            transform: scale(0.9);
        }
        #back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: bold;
            z-index: 20;
            display: none;
        }
        #loading-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #94a3b8;
            z-index: 5;
            background: rgba(15, 23, 42, 0.85);
            padding: 15px 30px;
            border-radius: 14px;
            border: 1px solid #334155;
            pointer-events: none;
            text-align: center;
            display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="selection-screen">
        <h1>BİR EVCİL HAYVAN SEÇ</h1>
        <button class="char-select-btn gus" onclick="selectCharacter('gus')">Gus 🐾</button>
        <button class="char-select-btn squeak" onclick="selectCharacter('squeak')">Squeak 🐹</button>
    </div>

    <button id="back-btn" onclick="goBack()">⬅ Geri</button>
    <div id="ui-top" id="game-title">🐾 MY TALKING PET 🐾</div>
    
    <div id="loading-text">Evcil Hayvanlar Yükleniyor...</div>
    <div id="canvas-container"></div>

    <div id="ui-bottom">
        <button class="action-btn" onclick="interact('feed')">🍖</button>
        <button class="action-btn" onclick="interact('poke')">👉</button>
        <button class="action-btn" onclick="interact('dance')">🕺</button>
    </div>

<script>
    let scene, camera, renderer, mainModel, mixer;
    let clock = new THREE.Clock();
    let currentPet = 'gus';

    // Yeni paylaştığın toplu pet modeli linki:
    const modelUrl = "https://raw.githubusercontent.com/darwin456222-ops/Duruoyun/main/tom_2_pets%20(1).glb";

    function selectCharacter(pet) {
        currentPet = pet;
        document.getElementById('selection-screen').style.display = 'none';
        document.getElementById('ui-top').style.display = 'block';
        document.getElementById('ui-bottom').style.display = 'flex';
        document.getElementById('back-btn').style.display = 'block';
        document.getElementById('ui-top').innerText = pet === 'gus' ? "🐾 MY TALKING GUS 🐾" : "🐹 MY TALKING SQUEAK 🐹";
        
        if (!scene) {
            init3D();
        } else {
            filterCharacter();
        }
    }

    function goBack() {
        document.getElementById('selection-screen').style.display = 'flex';
        document.getElementById('ui-top').style.display = 'none';
        document.getElementById('ui-bottom').style.display = 'none';
        document.getElementById('back-btn').style.display = 'none';
    }

    function init3D() {
        document.getElementById('loading-text').style.display = 'block';
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0, 0.5, 2.5); 

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        // Işıklandırma ayarları
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.2);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight1.position.set(5, 10, 7);
        scene.add(dirLight1);

        const loader = new THREE.GLTFLoader();
        
        loader.load(modelUrl, 
            function (gltf) {
                mainModel = gltf.scene;
                scene.add(mainModel);
                document.getElementById('loading-text').style.display = 'none';

                // Modelleri tarayıp isimlerine göre ayıklama yapıyoruz
                filterCharacter();

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(mainModel);
                    mixer.clipAction(gltf.animations[0]).play();
                }
            }, 
            function (xhr) {
                if(xhr.total > 0) {
                    document.getElementById('loading-text').innerText = "Model Yükleniyor: %" + Math.round((xhr.loaded / xhr.total * 100));
                }
            }, 
            function (error) {
                console.error(error);
                document.getElementById('loading-text').innerHTML = "Yükleme Hatası!";
            }
        );

        window.addEventListener('resize', onWindowResize, false);
        animate();
    }

    // 🔥 2. YÖNTEM: MODEL İÇİNDEKİ NESNELERİ GİZLEME / GÖSTERME VE MERKEZLEME FİLTRESİ
    function filterCharacter() {
        if (!mainModel) return;

        let activeMesh = null;

        mainModel.traverse(function (child) {
            if (child.isMesh || child.type === "Group") {
                let name = child.name.toLowerCase();
                
                // Eğer Gus seçildiyse içinde 'squeak' geçen parçaları gizle, 'gus' geçenleri göster
                if (currentPet === 'gus') {
                    if (name.includes('squeak')) child.visible = false;
                    if (name.includes('gus')) {
                        child.visible = true;
                        activeMesh = child;
                    }
                } 
                // Squeak seçildiyse tam tersini yap
                else if (currentPet === 'squeak') {
                    if (name.includes('gus')) child.visible = false;
                    if (name.includes('squeak')) {
                        child.visible = true;
                        activeMesh = child;
                    }
                }
            }
        });

        // Seçilen karakteri ekranın tam ortasına otomatik hizala ve sığdır
        const box = new THREE.Box3().setFromObject(mainModel);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        
        mainModel.position.x += (mainModel.position.x - center.x);
        mainModel.position.y += (mainModel.position.y - center.y) - 0.2;
        mainModel.position.z += (mainModel.position.z - center.z);
        
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) {
            const scale = 1.4 / maxDim;
            mainModel.scale.set(scale, scale, scale);
        }
    }

    function interact(action) {
        if (!mainModel) return;

        if (action === 'feed') {
            mainModel.position.y += 0.2;
            setTimeout(() => mainModel.position.y -= 0.2, 200);
        } 
        else if (action === 'poke') {
            mainModel.rotation.z = 0.2;
            setTimeout(() => mainModel.rotation.z = -0.2, 150);
            setTimeout(() => mainModel.rotation.z = 0, 300);
        }
        else if (action === 'dance') {
            let targetRotation = mainModel.rotation.y + Math.PI * 2;
            let danceInterval = setInterval(() => {
                mainModel.rotation.y += 0.25;
                if (mainModel.rotation.y >= targetRotation) {
                    clearInterval(danceInterval);
                }
            }, 20);
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        let delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (mainModel && !mixer) {
            mainModel.rotation.y = Math.sin(Date.now() * 0.0015) * 0.15;
        }

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
