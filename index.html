<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Talking Pets 3D - Master Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            /* Beyaz ekran hatasını tamamen bitiren, karakterleri öne çıkaran derin stüdyo arka planı */
            background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 20px;
        }
        
        #selection-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 13, 22, 0.98);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }
        #selection-screen h1 {
            font-size: 32px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
            margin-bottom: 15px;
            font-weight: 800;
        }
        .char-select-btn {
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: 260px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .char-select-btn.gus {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
        }
        .char-select-btn.flip {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        }
        .char-select-btn.sugar {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
        }
        .char-select-btn:active {
            transform: scale(0.95);
        }

        #ui-top {
            background: rgba(15, 23, 42, 0.75);
            padding: 12px 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 1px;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            display: none;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-bottom {
            display: none;
            gap: 25px;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .action-btn {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
            transition: transform 0.1s;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn:active {
            transform: scale(0.9);
        }
        #back-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            z-index: 20;
            cursor: pointer;
            display: none;
        }
        #loading-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #94a3b8;
            z-index: 105;
            background: rgba(15, 23, 42, 0.95);
            padding: 15px 30px;
            border-radius: 14px;
            border: 1px solid #334155;
            pointer-events: none;
            text-align: center;
            display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="selection-screen">
        <h1>3D KARAKTER SEÇ</h1>
        <button class="char-select-btn gus" onclick="selectCharacter('gus')">Talking Gus 🐾</button>
        <button class="char-select-btn flip" onclick="selectCharacter('flip')">Talking Flip 🐶</button>
        <button class="char-select-btn sugar" onclick="selectCharacter('sugar')">Talking Sugar 🐱</button>
    </div>

    <button id="back-btn" onclick="goBack()">⬅ Karakter Değiştir</button>
    <div id="ui-top">🐾 MY TALKING PET 🐾</div>
    
    <div id="loading-text">Karakter Odaya Çağrılıyor...</div>
    <div id="canvas-container"></div>

    <div id="ui-bottom">
        <button class="action-btn" onclick="interact('feed')">🍖</button>
        <button class="action-btn" onclick="interact('poke')">👉</button>
        <button class="action-btn" onclick="interact('dance')">🕺</button>
    </div>

<script>
    let scene, camera, renderer, petModel, mixer;
    let clock = new THREE.Clock();
    let currentPet = 'gus';

    // 🔗 Tamamen sana ait temiz raw linkler
    const urls = {
        gus: "https://raw.githubusercontent.com/darwin456222-ops/Duruoyun/main/my_talking_tom_2_gus.glb",
        flip: "https://raw.githubusercontent.com/darwin456222-ops/Duruoyun/main/my_talking_tom_2_flip%20(1).glb",
        sugar: "https://raw.githubusercontent.com/darwin456222-ops/Duruoyun/main/my_talking_tom_2_sugar.glb"
    };

    function selectCharacter(pet) {
        currentPet = pet;
        document.getElementById('selection-screen').style.display = 'none';
        document.getElementById('ui-top').style.display = 'block';
        document.getElementById('ui-bottom').style.display = 'flex';
        document.getElementById('back-btn').style.display = 'block';
        
        const uiTop = document.getElementById('ui-top');
        const actionButtons = document.querySelectorAll('.action-btn');
        
        if (pet === 'gus') {
            uiTop.innerText = "🐾 TALKING GUS 3D 🐾";
            actionButtons.forEach(btn => btn.style.background = 'linear-gradient(135deg, #a855f7 0%, #7c3aed 100%)');
        } else if (pet === 'flip') {
            uiTop.innerText = "🐶 TALKING FLIP 3D 🐾";
            actionButtons.forEach(btn => btn.style.background = 'linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%)');
        } else if (pet === 'sugar') {
            uiTop.innerText = "🐱 TALKING SUGAR 3D 🐾";
            actionButtons.forEach(btn => btn.style.background = 'linear-gradient(135deg, #ec4899 0%, #db2777 100%)');
        }

        if (!scene) {
            init3D();
        } else {
            loadPetModel();
        }
    }

    function goBack() {
        document.getElementById('selection-screen').style.display = 'flex';
        document.getElementById('ui-top').style.display = 'none';
        document.getElementById('ui-bottom').style.display = 'none';
        document.getElementById('back-btn').style.display = 'none';
        
        if (petModel) {
            scene.remove(petModel);
            petModel = null;
            mixer = null;
        }
    }

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();

        // 🎯 Kamerayı tam oda odağına getirdik (Karakterler dev gibi karşımızda duracak)
        camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0, 0.2, 1.4); 
        camera.lookAt(0, 0.15, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        // 💡 Karakterlerin detaylarını pırıl pırıl gösteren stüdyo ışıkları
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
        dirLight.position.set(4, 10, 5);
        scene.add(dirLight);

        // 🧱 Yumuşak bir zemin gölgesi paneli (Ayakları havada kalmasın diye)
        const floorGeo = new THREE.PlaneGeometry(5, 5);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.3;
        scene.add(floor);

        loadPetModel();

        window.addEventListener('resize', onWindowResize, false);
        animate();
    }

    function loadPetModel() {
        if (petModel) {
            scene.remove(petModel);
            mixer = null;
        }

        document.getElementById('loading-text').style.display = 'block';

        const loader = new THREE.GLTFLoader();
        
        loader.load(urls[currentPet], 
            function (gltf) {
                petModel = gltf.scene;
                
                // 🎯 Sorunsuz evrensel boyut ve konum hizalaması
                petModel.position.set(0, -0.25, 0);
                petModel.scale.set(1.0, 1.0, 1.0);
                
                scene.add(petModel);
                document.getElementById('loading-text').style.display = 'none';

                // Eğer modelde kendi orijinal animasyonu varsa otomatik oynatır
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(petModel);
                    mixer.clipAction(gltf.animations[0]).play();
                }
            }, 
            function (xhr) {
                if(xhr.total > 0) {
                    document.getElementById('loading-text').innerText = "Yükleniyor: %" + Math.round((xhr.loaded / xhr.total * 100));
                }
            }, 
            function (error) {
                console.error(error);
                document.getElementById('loading-text').innerText = "Hata oluştu!";
            }
        );
    }

    // Etkileşim butonları fonksiyonu
    function interact(action) {
        if (!petModel) return;

        if (action === 'feed') {
            // Havaya zıplama efekti
            petModel.position.y += 0.08;
            setTimeout(() => petModel.position.y -= 0.08, 200);
        } 
        else if (action === 'poke') {
            // Sağa sola tatlıca yattırma efekti
            petModel.rotation.z = 0.06;
            setTimeout(() => petModel.rotation.z = -0.06, 150);
            setTimeout(() => petModel.rotation.z = 0, 300);
        }
        else if (action === 'dance') {
            // Kendi etrafında tam tur dönme efekti
            let targetRotation = petModel.rotation.y + Math.PI * 2;
            let danceInterval = setInterval(() => {
                petModel.rotation.y += 0.25;
                if (petModel.rotation.y >= targetRotation) {
                    clearInterval(danceInterval);
                }
            }, 20);
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        let delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        // Canlılık efekti: Eğer arka planda kendi animasyonu yoksa yavaşça nefes alma sallantısı yapar
        if (petModel && !mixer) {
            petModel.rotation.y = Math.sin(Date.now() * 0.0015) * 0.04;
        }

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
